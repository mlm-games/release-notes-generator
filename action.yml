name: 'release-notes-generator'
description: 'Generate release notes for CHANGELOG.md, version files, and various release platforms'
author: 'mlm-games'

inputs:
  version:
    description: 'Version number (e.g., 1.2.3)'
    required: true
  head-ref:
    description: 'Custom head ref'
    required: false
    default: 'HEAD'
  changelog-path:
    description: 'Path to CHANGELOG.md'
    required: false
    default: 'CHANGELOG.md'
  version-file-path:
    description: 'Path to version file (e.g., fastlane changelogs/123.txt)'
    required: false
    default: ''
  version-code:
    description: 'Version code for Android/Fastlane'
    required: false
    default: ''
  metainfo-path:
    description: 'Path to Flathub metainfo.xml file'
    required: false
    default: ''
  format:
    description: 'Line format for each commit'
    required: false
    default: '- {{subject}}'
  debug:
    description: 'Print debug info (range, preview)'
    required: false
    default: 'false'
  exclude-patterns:
    description: 'Comma-separated subject prefixes/patterns to exclude (anchored)'
    required: false
    default: 'chore:,ci:,docs:,build:,style:,test:,Bump version,bump version,Update release notes,Update version,Merge pull request,Merge branch,[skip ci],dependabot'
  vercode-prefix:
    description: 'Prefix before version in CHANGELOG header (e.g., "v")'
    required: false
    default: 'v'
  auto-commit:
    description: 'Automatically commit changes'
    required: false
    default: 'true'
  commit-message:
    description: 'Commit message template'
    required: false
    default: 'docs: update release notes for v{{version}} [skip ci]'
  fallback-notes:
    description: 'Text used when no commits match'
    required: false
    default: '- No user-facing changes were mentioned since previous release'

outputs:
  release-notes:
    description: 'Generated release notes'
    value: ${{ steps.generate.outputs.release-notes }}
  release-name:
    description: 'Release name (latest commit subject)'
    value: ${{ steps.generate.outputs.release-name }}
  changelog-updated:
    description: 'Whether CHANGELOG.md was updated'
    value: ${{ steps.changelog.outputs.changelog-updated }}
  files-changed:
    description: 'List of files that were changed'
    value: ${{ steps.files.outputs.files-changed }}

runs:
  using: 'composite'
  steps:
    - name: Generate Release Notes
      id: generate
      shell: bash
      run: |
        set -Eeuo pipefail

        HEAD_REF="${{ inputs.head-ref }}"
        FALLBACK="${{ inputs.fallback-notes }}"

        # Best-effort: need full history + tags (callers should use fetch-depth: 0)
        git fetch --tags --force 2>/dev/null || true
        # Unshallow if someone checked out shallow
        if git rev-parse --is-shallow-repository 2>/dev/null | grep -qx true; then
          git fetch --unshallow --tags --force 2>/dev/null || git fetch --deepen=2147483647 --tags 2>/dev/null || true
        fi

        # Resolve previous tag: prefer version-like tags over the current head tag
        HEAD_TAG="$(git describe --tags --exact-match "${HEAD_REF}" 2>/dev/null || true)"
        LATEST_TAG="$(git describe --tags --abbrev=0 "${HEAD_REF}" 2>/dev/null || true)"
        PREV_TAG=""
        if [ -n "$HEAD_TAG" ]; then
          PREV_TAG="$(git describe --tags --abbrev=0 --exclude="$HEAD_TAG" "${HEAD_REF}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git tag --list --sort=-v:refname | grep -Ev "^${HEAD_TAG}$" | head -n1 || true)"
          fi
        elif [ -n "$LATEST_TAG" ]; then
          PREV_TAG="$LATEST_TAG"
        fi

        if [ -n "$PREV_TAG" ]; then
          RANGE="${PREV_TAG}..${HEAD_REF}"
        else
          RANGE="${HEAD_REF}"
        fi

        # Build anchored exclude regex
        RAW="${{ inputs.exclude-patterns }}"
        IFS=',' read -ra EX_PATTERNS <<< "$RAW"
        EX_REGEX=""
        for p in "${EX_PATTERNS[@]}"; do
          p="$(echo "$p" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
          [ -z "$p" ] && continue
          ep="$(printf '%s' "$p" | sed -E 's/[][(){}.^$*+?|\\/]/\\&/g')"
          ep="^${ep}"
          EX_REGEX="${EX_REGEX:+${EX_REGEX}|}${ep}"
        done

        gh_handle() {
          local name="$1" email="$2" lp handle=""
          if [[ "$email" =~ ^([^@]+)@users\.noreply\.github\.com$ ]]; then
            lp="${BASH_REMATCH[1]}"
            if [[ "$lp" == *"+"* ]]; then handle="${lp#*+}"; else handle="$lp"; fi
          fi
          if [ -z "$handle" ] && [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}(\[bot\])?$ ]]; then
            handle="${name%\[bot\]}"
          fi
          printf '%s' "$handle"
        }

        RELEASE_NOTES=""
        RELEASE_NAME=""
        sep_f=$'\x1f'
        sep_r=$'\x1e'

        # No -z: custom RS only (avoids NUL + RS double-separator bugs)
        while IFS= read -r -d "$sep_r" rec; do
          [ -z "$rec" ] && continue
          # Strip any accidental leading NULs
          rec="${rec#"${rec%%[!$' \t\n\r\0']*}"}"

          IFS="$sep_f" read -r subject author author_email committer committer_email hash short body <<< "$rec" || true
          [ -z "${subject:-}" ] && continue

          if [ -n "$EX_REGEX" ] && printf '%s' "$subject" | grep -Eq "$EX_REGEX"; then
            continue
          fi

          subject="$(printf '%s' "$subject" | tr -d '\r' | sed -E 's/[[:space:]]+$//')"
          body="$(printf '%s' "${body:-}" | tr '\r\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/[[:space:]]+$//')"
          msg="$(printf '%s %s' "$subject" "$body" | sed -E 's/[[:space:]]+/ /g; s/[[:space:]]+$//')"

          author_handle="$(gh_handle "$author" "$author_email")"
          committer_handle="$(gh_handle "$committer" "$committer_email")"

          subject_safe="${subject//&/\\&}"
          author_safe="${author//&/\\&}"
          committer_safe="${committer//&/\\&}"
          author_email_safe="${author_email//&/\\&}"
          committer_email_safe="${committer_email//&/\\&}"
          author_handle_safe="${author_handle//&/\\&}"
          committer_handle_safe="${committer_handle//&/\\&}"
          hash_safe="${hash//&/\\&}"
          short_safe="${short//&/\\&}"
          msg_safe="${msg//&/\\&}"

          tpl='${{ inputs.format }}'
          tpl="${tpl//\{\{subject\}\}/$subject_safe}"
          tpl="${tpl//\{\{author\}\}/$author_safe}"
          tpl="${tpl//\{\{committer\}\}/$committer_safe}"
          tpl="${tpl//\{\{author-email\}\}/$author_email_safe}"
          tpl="${tpl//\{\{committer-email\}\}/$committer_email_safe}"
          tpl="${tpl//\{\{author-handle\}\}/$author_handle_safe}"
          tpl="${tpl//\{\{committer-handle\}\}/$committer_handle_safe}"
          tpl="${tpl//\{\{hash\}\}/$hash_safe}"
          tpl="${tpl//\{\{short-hash\}\}/$short_safe}"
          tpl="${tpl//\{\{short\}\}/$short_safe}"
          tpl="${tpl//\{\{message\}\}/$msg_safe}"

          while [[ "$tpl" =~ \{\{([^}]+)\}\} ]]; do
            old_tpl="$tpl"
            raw="${BASH_REMATCH[1]}"
            repl=""
            IFS='|' read -ra parts <<< "$raw"
            for part in "${parts[@]}"; do
              case "$part" in
                subject)            repl="$subject_safe" ;;
                author)             repl="$author_safe" ;;
                committer)          repl="$committer_safe" ;;
                author-email)       repl="$author_email_safe" ;;
                committer-email)    repl="$committer_email_safe" ;;
                author-handle)      repl="$author_handle_safe" ;;
                committer-handle)   repl="$committer_handle_safe" ;;
                hash)               repl="$hash_safe" ;;
                short|short-hash)   repl="$short_safe" ;;
                message)            repl="$msg_safe" ;;
              esac
              [ -n "$repl" ] && break
            done
            tpl="${tpl/${BASH_REMATCH[0]}/$repl}"
            [[ "$tpl" == "$old_tpl" ]] && break
          done

          tpl="$(printf '%s' "$tpl" \
                | sed -E 's/[[:space:]]+/ /g; s/^[[:space:]]+|[[:space:]]+$//g' \
                | sed -E 's/[[:space:]]+by[[:space:]]+@$//; s/@$//')"

          if ! printf '%s' "$tpl" | grep -qE '^[*-] '; then
            tpl="- $tpl"
          fi

          [ -n "$tpl" ] && RELEASE_NOTES+="${tpl}"$'\n'
          [ -z "$RELEASE_NAME" ] && RELEASE_NAME="$subject"
        done < <(git log --no-merges ${RANGE} \
          --pretty=format:"%s%x1f%an%x1f%ae%x1f%cn%x1f%ce%x1f%H%x1f%h%x1f%b%x1e" 2>/dev/null || true)

        # Trim + fallback if empty/whitespace-only
        RELEASE_NOTES="$(printf '%s' "$RELEASE_NOTES" | sed -E 's/[[:space:]]+$//')"
        if [ -z "$RELEASE_NOTES" ]; then
          RELEASE_NOTES="$FALLBACK"
        fi
        [ -z "$RELEASE_NAME" ] && RELEASE_NAME="Release ${{ inputs.version }}"

        if [ "${{ inputs.debug }}" = "true" ]; then
          echo "Latest tag: ${LATEST_TAG:-<none>}"
          echo "Head ref: ${HEAD_REF}"
          echo "Head tag: ${HEAD_TAG:-<none>}"
          echo "Prev tag: ${PREV_TAG:-<none>}"
          echo "Range: ${RANGE}"
          echo "Exclude regex: ${EX_REGEX:-<none>}"
          echo "Shallow: $(git rev-parse --is-shallow-repository 2>/dev/null || echo unknown)"
          echo "Preview:"
          printf '%s\n' "$RELEASE_NOTES" | head -30
        fi

        DELIM="END_OF_RELEASE_NOTES_$(date +%s%N)_$RANDOM"
        {
          printf 'release-notes<<%s\n' "$DELIM"
          printf '%s\n' "$RELEASE_NOTES"
          printf '%s\n' "$DELIM"
          printf 'release-name=%s\n' "$RELEASE_NAME"
        } >> "$GITHUB_OUTPUT"

        # Always non-empty file for downstream body_path consumers
        printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.txt

    - name: Update CHANGELOG.md
      if: inputs.changelog-path != ''
      id: changelog
      shell: bash
      run: |
        set -Eeuo pipefail
        CHANGELOG_PATH="${{ inputs.changelog-path }}"
        VERSION="${{ inputs.version }}"
        PREFIX="${{ inputs.vercode-prefix }}"
        HEADER_LINE="## ${PREFIX}${VERSION}"
        UPDATED="false"

        write_notes() { cat /tmp/release-notes.txt; }

        if [ -f "$CHANGELOG_PATH" ]; then
          if grep -Fq "$HEADER_LINE" "$CHANGELOG_PATH"; then
            echo "Version already present: $HEADER_LINE"
          else
            {
              echo "$HEADER_LINE"
              echo ""
              write_notes
              echo ""
              echo ""
              cat "$CHANGELOG_PATH"
            } > /tmp/new-changelog.md
            mv /tmp/new-changelog.md "$CHANGELOG_PATH"
            UPDATED="true"
          fi
        else
          {
            echo "# Changelog"
            echo ""
            echo "$HEADER_LINE"
            echo ""
            write_notes
            echo ""
          } > "$CHANGELOG_PATH"
          UPDATED="true"
        fi
        echo "changelog-updated=$UPDATED" >> "$GITHUB_OUTPUT"

    - name: Update Version File
      if: inputs.version-file-path != '' && inputs.version-code != ''
      shell: bash
      run: |
        set -Eeuo pipefail
        VERSION_FILE="${{ inputs.version-file-path }}"
        VERSION_CODE="${{ inputs.version-code }}"
        mkdir -p "$(dirname "$VERSION_FILE")"
        if [[ "$VERSION_FILE" == *"/changelogs/"* ]]; then
          cat /tmp/release-notes.txt > "$VERSION_FILE"
        else
          echo "$VERSION_CODE" > "$VERSION_FILE"
        fi

    - name: Update Flathub Metainfo
      if: inputs.metainfo-path != ''
      shell: bash
      run: |
        set -Eeuo pipefail

        sudo apt update
        sudo apt install -y xmlstarlet
    
        METAINFO="${{ inputs.metainfo-path }}"
        VERSION="${{ inputs.version }}"
        DATE="$(date +%F)"
        NOTES=/tmp/release-notes.txt
    
        if [ ! -f "$METAINFO" ]; then
          echo "::warning::metainfo not found: $METAINFO"
          exit 0
        fi
    
        # Stop if the same version is already present
        if xmlstarlet sel -t -v "/component/releases/release[@version='${VERSION}']" "$METAINFO" \
           | grep -q . ; then
          echo "Version $VERSION already listed – skipping"
          exit 0
        fi
    
        # 1.  Create an *empty* <release/> as the new first child
        #     of <releases>.  If no <release> exists yet, we simply append.
        if xmlstarlet sel -t -c '/component/releases/release[1]' "$METAINFO" | grep -q . ; then
          # There is at least one existing release → insert *before* it
          xmlstarlet ed -L \
            --insert '/component/releases/release[1]' --type elem -n release -v '' \
            "$METAINFO"
        else
          # No <release> yet → just create the node
          xmlstarlet ed -L \
            --subnode '/component/releases'          --type elem -n release -v '' \
            "$METAINFO"
        fi
    
        # 2.  Add mandatory attributes to that first <release>
        xmlstarlet ed -L \
          --insert '/component/releases/release[1]' --type attr -n version -v "$VERSION" \
          --insert '/component/releases/release[1]' --type attr -n date    -v "$DATE" \
          --insert '/component/releases/release[1]' --type attr -n type    -v "stable" \
          "$METAINFO"
    
        # 3.  Build the description list
        xmlstarlet ed -L \
          --subnode '/component/releases/release[1]'            --type elem -n description -v '' \
          --subnode '/component/releases/release[1]/description' --type elem -n ul          -v '' \
          "$METAINFO"
    
        if [ -s "$NOTES" ]; then
          while IFS= read -r line; do
            # Trim leading “- ” and surrounding whitespace
            line="$(printf '%s' "$line" | sed -E 's/^[-*][[:space:]]*//; s/[[:space:]]+$//')"
            [ -z "$line" ] && continue           # ← skip empty lines
            xmlstarlet ed -L \
              --subnode '/component/releases/release[1]/description/ul' \
              --type elem -n li -v "$(xmlstarlet esc <<<"$line")" \
              "$METAINFO"
          done < "$NOTES"
        else
          xmlstarlet ed -L \
            --subnode '/component/releases/release[1]/description/ul' \
            --type elem -n li -v "No changes since previous release" \
            "$METAINFO"
        fi

        appstreamcli validate --pedantic "$METAINFO" # For validation (similar to flathub's)
    
        echo "Metainfo updated: $METAINFO"

    - name: Collect Changed Files
      id: files
      shell: bash
      run: |
        set -Eeuo pipefail
        CHANGED_FILES=""
        if [ "${{ steps.changelog.outputs.changelog-updated }}" = "true" ]; then
          CHANGED_FILES="${{ inputs.changelog-path }}"
        fi
        if [ -n "${{ inputs.version-file-path }}" ] && [ -n "${{ inputs.version-code }}" ]; then
          CHANGED_FILES="${CHANGED_FILES:+$CHANGED_FILES,}${{ inputs.version-file-path }}"
        fi
        if [ -n "${{ inputs.metainfo-path }}" ] && [ -f "${{ inputs.metainfo-path }}" ]; then
          CHANGED_FILES="${CHANGED_FILES:+$CHANGED_FILES,}${{ inputs.metainfo-path }}"
        fi
        echo "files-changed=$CHANGED_FILES" >> "$GITHUB_OUTPUT"

    - name: Commit Changes
      if: inputs.auto-commit == 'true' && steps.files.outputs.files-changed != ''
      shell: bash
      run: |
        set -Eeuo pipefail
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        IFS=',' read -ra FILES <<< "${{ steps.files.outputs.files-changed }}"
        for file in "${FILES[@]}"; do
          [ -f "$file" ] && git add "$file"
        done
        COMMIT_MSG="${{ inputs.commit-message }}"
        COMMIT_MSG="${COMMIT_MSG//\{\{version\}\}/${{ inputs.version }}}"
        git commit -m "$COMMIT_MSG" || echo "No changes to commit"
        git push || echo "Nothing to push"

branding:
  icon: 'file-text'
  color: 'blue'
